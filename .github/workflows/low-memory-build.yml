name: Low-memory Windows build

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/background/widgets/webview.rs"
      - "src/background/widgets/loader.rs"
      - "src/background/widgets/manager.rs"
      - "src/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/low-memory-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: x86_64-pc-windows-msvc
          cache-key-prefix: low-memory-build

      - name: Install frontend dependencies and generate core library
        run: npm install

      - name: Build hook DLL
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p sluhk

      - name: Build Seelen UI (unsigned CI artifact, no installer bundle)
        # CI does not have the release signing key. This opt-in is explicitly supported
        # by src/build.rs and is only for test artifacts; do not distribute as a signed release.
        env:
          SEELEN_ALLOW_UNSIGNED_BUILD: "1"
        run: npx tauri build --ci --verbose --no-bundle --target x86_64-pc-windows-msvc

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seelen-ui-low-memory-x64
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/*.exe
            target/x86_64-pc-windows-msvc/release/*.dll
            target/x86_64-pc-windows-msvc/release/static/**
